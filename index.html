<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Julius Ervin B. Dela Torre — Web Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Julius Ervin B. Dela Torre, an aspiring web developer from the Philippines, with a Filipino traditional pattern theme."
    />
    <meta name="theme-color" content="#FFF0DE" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Serif:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = saved || (prefersDark ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#503513' : '#FFF0DE')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
